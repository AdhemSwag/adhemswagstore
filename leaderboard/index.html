<style>
  :root{
    --bg:#05070a; --bg-panel:#0b0f12; --cyan:#11d9f7; --cyan-dim:#0a8fa3;
    --white:#eaf6f8; --muted:#6b7a80; --line:rgba(17,217,247,0.14); --grid:rgba(17,217,247,0.045);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:var(--bg); color:var(--white); font-family:'Inter',sans-serif;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 42px 42px;
  }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.22em; text-transform:uppercase; color:var(--cyan-dim); }
  .bracket{ position:relative; }
  .bracket::before, .bracket::after{ content:""; position:absolute; width:14px; height:14px; border-color:var(--cyan); border-style:solid; opacity:0.85; }
  .bracket::before{ top:-1px; left:-1px; border-width:2px 0 0 2px; }
  .bracket::after{ bottom:-1px; right:-1px; border-width:0 2px 2px 0; }

  header{ display:flex; align-items:center; justify-content:space-between; padding:22px clamp(20px,5vw,64px); border-bottom:1px solid var(--line); flex-wrap:wrap; gap:14px; }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; }
  .brand-name{ font-family:'JetBrains Mono', monospace; font-size:13px; letter-spacing:0.12em; color:var(--white); }
  .brand-name span{ color:var(--cyan); }

  .nav-menu{ display:flex; gap:10px; flex-wrap:wrap; }
  .nav-menu a{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--cyan); text-decoration:none; border:1px solid var(--line); padding:8px 16px;
    transition: all .2s ease;
  }
  .nav-menu a:hover{ background:rgba(17,217,247,0.08); border-color:var(--cyan); box-shadow:0 0 12px rgba(17,217,247,0.2); }
  .socials{ display:flex; gap:10px; flex-wrap:wrap; }
  .socials a{
    width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); color:var(--cyan); text-decoration:none;
    transition: all .2s ease;
  }
  .socials a:hover{ background:rgba(17,217,247,0.08); border-color:var(--cyan); box-shadow:0 0 12px rgba(17,217,247,0.25); }
  .socials svg{ width:15px; height:15px; fill:currentColor; }

  main{ max-width:900px; margin:0 auto; padding: clamp(30px,5vw,60px) clamp(20px,5vw,64px) 80px; }
  h1{
    font-family:'Rajdhani', sans-serif; font-weight:700; text-transform:uppercase;
    font-size: clamp(28px, 4vw, 42px); letter-spacing:0.02em; color:var(--white); margin-top:10px; margin-bottom:6px;
  }
  h1 span{ color:var(--cyan); text-shadow:0 0 20px rgba(17,217,247,0.45); }
  .page-sub{ color:var(--muted); font-size:13px; margin-bottom:30px; }

  .lb-table{ background:var(--bg-panel); border:1px solid var(--line); overflow:hidden; }
  .lb-row{
    display:grid; grid-template-columns: 70px 1fr 140px; align-items:center; gap:10px;
    padding:13px 20px; border-bottom:1px solid var(--line); font-size:13.5px;
    border-left:3px solid transparent;
  }
  .lb-row:last-child{ border-bottom:none; }
  .lb-head{
    font-family:'JetBrains Mono', monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--cyan); background:rgba(17,217,247,0.05);
  }
  .lb-rank{ font-family:'JetBrains Mono', monospace; color:var(--muted); font-weight:600; }
  .lb-user{ color:var(--white); font-weight:500; }
  .lb-points{ font-family:'JetBrains Mono', monospace; color:var(--cyan); font-weight:700; text-align:right; }
  .lb-points span{ color:var(--muted); font-weight:400; font-size:10px; }

  .lb-row.top1{ background:rgba(255,215,0,0.08); border-left:3px solid #FFD700; }
  .lb-row.top1 .lb-rank{ color:#FFD700; font-weight:700; }
  .lb-row.top1 .lb-points{ color:#FFD700; }
  .lb-row.top2{ background:rgba(197,203,214,0.08); border-left:3px solid #C5CBD6; }
  .lb-row.top2 .lb-rank{ color:#C5CBD6; font-weight:700; }
  .lb-row.top2 .lb-points{ color:#C5CBD6; }
  .lb-row.top3{ background:rgba(205,127,50,0.08); border-left:3px solid #CD7F32; }
  .lb-row.top3 .lb-rank{ color:#CD7F32; font-weight:700; }
  .lb-row.top3 .lb-points{ color:#CD7F32; }

  .lb-more{
    display:inline-flex; align-items:center; gap:10px; margin-top:20px;
    color:var(--cyan); text-decoration:none; border:1px solid var(--line); padding:13px 24px;
    font-family:'JetBrains Mono', monospace; font-size:12.5px; letter-spacing:0.06em; text-transform:uppercase;
    transition: all .2s ease;
  }
  .lb-more:hover{ background:rgba(17,217,247,0.08); border-color:var(--cyan); box-shadow:0 0 14px rgba(17,217,247,0.2); }
  .lb-note{ margin-top:14px; font-size:12px; color:var(--muted); }

  .lb-loading{ padding:30px 20px; text-align:center; color:var(--muted); font-family:'JetBrains Mono', monospace; font-size:12.5px; }

  .lb-podium{
    display:grid; grid-template-columns: 1fr 1.1fr 1fr; gap:18px; margin-bottom:30px; align-items:end;
  }
  .lb-podium-card{
    background:var(--bg-panel); border:1px solid var(--line); padding:26px 20px; text-align:center; position:relative;
  }
  .lb-podium-card.champion{ padding-top:32px; padding-bottom:34px; border-color:rgba(255,215,0,0.4); }
  .lb-podium-label{
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin-bottom:14px;
  }
  .lb-podium-badge{
    display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:50%;
    font-family:'Rajdhani', sans-serif; font-weight:700; font-size:16px; margin-bottom:14px;
  }
  .lb-podium-card.rank1 .lb-podium-badge{ background:#FFD700; color:#05070a; }
  .lb-podium-card.rank2 .lb-podium-badge{ background:#C5CBD6; color:#05070a; }
  .lb-podium-card.rank3 .lb-podium-badge{ background:#CD7F32; color:#05070a; }

  .lb-podium-avatar{
    width:64px; height:64px; border-radius:50%; margin:0 auto 14px; display:flex; align-items:center; justify-content:center;
    background:rgba(17,217,247,0.08); border:2px solid var(--line);
  }
  .lb-podium-card.rank1 .lb-podium-avatar{ width:82px; height:82px; border-color:#FFD700; }
  .lb-podium-card.rank2 .lb-podium-avatar{ border-color:#C5CBD6; }
  .lb-podium-card.rank3 .lb-podium-avatar{ border-color:#CD7F32; }
  .lb-podium-avatar svg{ width:55%; height:55%; color:var(--cyan); }

  .lb-podium-name{ font-family:'Rajdhani', sans-serif; font-weight:700; font-size:18px; color:var(--white); margin-bottom:2px; }
  .lb-podium-card.rank1 .lb-podium-name{ font-size:21px; }
  .lb-podium-handle{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted); margin-bottom:14px; }

  .lb-podium-points{ font-family:'Rajdhani', sans-serif; font-weight:700; font-size:24px; }
  .lb-podium-card.rank1 .lb-podium-points{ color:#FFD700; font-size:30px; }
  .lb-podium-card.rank2 .lb-podium-points{ color:#C5CBD6; }
  .lb-podium-card.rank3 .lb-podium-points{ color:#CD7F32; }
  .lb-podium-points-label{ font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-top:2px; }

  .lb-pagination{
    display:flex; align-items:center; justify-content:center; gap:18px; margin-top:20px;
  }
  .lb-page-btn{
    background:var(--bg-panel); border:1px solid var(--line); color:var(--cyan);
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.05em; text-transform:uppercase;
    padding:11px 20px; cursor:pointer; transition: all .2s ease;
  }
  .lb-page-btn:hover:not(:disabled){ background:rgba(17,217,247,0.08); border-color:var(--cyan); box-shadow:0 0 12px rgba(17,217,247,0.2); }
  .lb-page-btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .lb-page-info{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted); letter-spacing:0.05em; }

  .lb-page-size{
    display:flex; align-items:center; gap:8px; margin-top:16px;
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.05em;
  }
  .lb-page-size-label{ color:var(--muted); text-transform:uppercase; }
  .lb-size-btn{
    background:var(--bg-panel); border:1px solid var(--line); color:var(--muted);
    font-family:'JetBrains Mono', monospace; font-size:12px; padding:8px 14px;
    cursor:pointer; transition: all .2s ease;
  }
  .lb-size-btn:hover{ border-color:var(--cyan); color:var(--cyan); }
  .lb-size-btn.active{ background:var(--cyan); color:#05070a; border-color:var(--cyan); font-weight:700; }

  footer{
    text-align:center; padding:34px 20px 40px; border-top:1px solid var(--line);
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted); letter-spacing:0.05em;
  }
  footer a{ color:var(--cyan); text-decoration:none; }
  footer .row{ margin-top:6px; }

  @media (max-width: 640px){
    header{ flex-wrap:wrap; justify-content:center; gap:14px; text-align:center; }
    .nav-menu{ justify-content:center; }
    .socials{ justify-content:center; }
    .lb-row{ grid-template-columns: 44px 1fr 100px; padding:12px 14px; font-size:12.5px; gap:6px; }
    .lb-more{ width:100%; justify-content:center; }
    .lb-pagination{ flex-wrap:wrap; gap:10px; }
    .lb-page-btn{ padding:10px 16px; font-size:11px; }
    .lb-size-btn{ padding:7px 12px; font-size:11px; }
    .lb-page-size{ flex-wrap:wrap; justify-content:center; }
    .lb-podium{ grid-template-columns: 1fr; }
    .lb-podium-card.champion{ order:-1; }
  }
</style>
</head>

      <div class="lb-points">Points</div>
    </div>
    <div id="lbBody">
      <div class="lb-loading">Loading leaderboard…</div>
    </div>
  </div>

  <div class="lb-page-size" id="lbPageSize">
    <span class="lb-page-size-label">Show:</span>
    <button class="lb-size-btn active" data-size="25">25</button>
    <button class="lb-size-btn" data-size="50">50</button>
    <button class="lb-size-btn" data-size="75">75</button>
    <button class="lb-size-btn" data-size="100">100</button>
  </div>

  <div class="lb-pagination" id="lbPagination">
    <button id="lbPrev" class="lb-page-btn">← Previous</button>
    <span id="lbPageInfo" class="lb-page-info">Page 1</span>
    <button id="lbNext" class="lb-page-btn">Next →</button>
  </div>
  <p class="lb-note" id="lbUpdatedNote">Updated automatically every 30 minutes.</p>
</main>

<footer>
  <div class="row">© 2026 AdhemSwag.com — All Rights Reserved</div>
  <div class="row">Collaboration: <a href="mailto:adhemswag@yahoo.com">adhemswag@yahoo.com</a></div>
</footer>

<script>
  let PAGE_SIZE = 25;
  let leaderboardData = [];
  let currentPage = 1;

  function medalClass(rank) {
    if (rank === 1) return 'lb-row top1';
    if (rank === 2) return 'lb-row top2';
    if (rank === 3) return 'lb-row top3';
    return 'lb-row';
  }

  function renderPage() {
    const body = document.getElementById('lbBody');
    const totalPages = Math.max(1, Math.ceil(leaderboardData.length / PAGE_SIZE));
    currentPage = Math.min(Math.max(1, currentPage), totalPages);

    const start = (currentPage - 1) * PAGE_SIZE;
    const pageItems = leaderboardData.slice(start, start + PAGE_SIZE);

    body.innerHTML = pageItems.map(entry => `
      <div class="${medalClass(entry.rank)}">
        <div class="lb-rank">#${entry.rank}</div>
        <div class="lb-user">${entry.username}</div>
        <div class="lb-points">${entry.points.toLocaleString()} <span>FNC</span></div>
      </div>
    `).join('');

    document.getElementById('lbPageInfo').textContent = `Page ${currentPage} / ${totalPages}`;
    document.getElementById('lbPrev').disabled = currentPage <= 1;
    document.getElementById('lbNext').disabled = currentPage >= totalPages;
    document.getElementById('lbPagination').style.display = 'flex';
    document.getElementById('lbPageSize').style.display = 'flex';
  }

  document.getElementById('lbPrev').addEventListener('click', () => { currentPage--; renderPage(); });
  document.getElementById('lbNext').addEventListener('click', () => { currentPage++; renderPage(); });

  document.querySelectorAll('.lb-size-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.lb-size-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      PAGE_SIZE = parseInt(btn.dataset.size, 10);
      currentPage = 1;
      renderPage();
    });
  });

  const AVATAR_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>';

  function renderPodium() {
    const podium = document.getElementById('lbPodium');
    if (leaderboardData.length < 3) { podium.style.display = 'none'; return; }

    const [first, second, third] = leaderboardData;

    const card = (entry, rankNum, label) => `
      <div class="lb-podium-card rank${rankNum}${rankNum === 1 ? ' champion' : ''}">
        <div class="lb-podium-label">${label}</div>
        <div class="lb-podium-badge">#${rankNum}</div>
        <div class="lb-podium-avatar">${AVATAR_ICON}</div>
        <div class="lb-podium-name">${entry.username}</div>
        <div class="lb-podium-handle">@${entry.username}</div>
        <div class="lb-podium-points">${entry.points.toLocaleString()}</div>
        <div class="lb-podium-points-label">FNC Points</div>
      </div>`;

    podium.innerHTML = card(second, 2, 'Runner Up') + card(first, 1, 'Champion') + card(third, 3, 'Top Three');
  }

  fetch('data.json')
    .then(r => r.json())
    .then(data => {
      leaderboardData = data;
      if (!leaderboardData.length) {
        document.getElementById('lbBody').innerHTML = '<div class="lb-loading">No leaderboard data yet.</div>';
        document.getElementById('lbPodium').style.display = 'none';
        return;
      }
      renderPodium();
      renderPage();
    })
    .catch(() => {
      document.getElementById('lbBody').innerHTML = '<div class="lb-loading">Couldn\'t load leaderboard data.</div>';
      document.getElementById('lbPodium').style.display = 'none';
    });
</script>

</body>
</html>
