<style>
  :root{
    --bg:#05070a; --bg-panel:#0b0f12; --cyan:#11d9f7; --cyan-dim:#0a8fa3;
    --white:#eaf6f8; --muted:#6b7a80; --line:rgba(17,217,247,0.14); --grid:rgba(17,217,247,0.045);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:var(--bg); color:var(--white); font-family:'Inter',sans-serif;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 42px 42px;
  }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.22em; text-transform:uppercase; color:var(--cyan-dim); }
  .bracket{ position:relative; }
  .bracket::before, .bracket::after{ content:""; position:absolute; width:14px; height:14px; border-color:var(--cyan); border-style:solid; opacity:0.85; }
  .bracket::before{ top:-1px; left:-1px; border-width:2px 0 0 2px; }
  .bracket::after{ bottom:-1px; right:-1px; border-width:0 2px 2px 0; }

  header{ display:flex; align-items:center; justify-content:space-between; padding:22px clamp(20px,5vw,64px); border-bottom:1px solid var(--line); flex-wrap:wrap; gap:14px; }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; }
  .brand-name{ font-family:'JetBrains Mono', monospace; font-size:13px; letter-spacing:0.12em; color:var(--white); }
  .brand-name span{ color:var(--cyan); }

  .nav-menu{ display:flex; gap:10px; flex-wrap:wrap; }
  .nav-menu a{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--cyan); text-decoration:none; border:1px solid var(--line); padding:8px 16px;
    transition: all .2s ease;
  }
  .nav-menu a:hover{ background:rgba(17,217,247,0.08); border-color:var(--cyan); box-shadow:0 0 12px rgba(17,217,247,0.2); }
  .socials{ display:flex; gap:10px; flex-wrap:wrap; }
  .socials a{
    width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); color:var(--cyan); text-decoration:none;
    transition: all .2s ease;
  }
  .socials a:hover{ background:rgba(17,217,247,0.08); border-color:var(--cyan); box-shadow:0 0 12px rgba(17,217,247,0.25); }
  .socials svg{ width:15px; height:15px; fill:currentColor; }

  main{ max-width:900px; margin:0 auto; padding: clamp(30px,5vw,60px) clamp(20px,5vw,64px) 80px; }
  h1{
    font-family:'Rajdhani', sans-serif; font-weight:700; text-transform:uppercase;
    font-size: clamp(28px, 4vw, 42px); letter-spacing:0.02em; color:var(--white); margin-top:10px; margin-bottom:6px;
  }
  h1 span{ color:var(--cyan); text-shadow:0 0 20px rgba(17,217,247,0.45); }
  .page-sub{ color:var(--muted); font-size:13px; margin-bottom:30px; }

  .lb-frame{ background:var(--bg-panel); border:1px solid var(--line); padding:0; overflow:hidden; position:relative; }
  .lb-frame iframe{ width:100%; height:900px; border:0; display:block; background:#0d1117; }

  .lb-status{
    display:flex; align-items:center; gap:8px; margin-bottom:14px;
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted);
  }
  .lb-dot{ width:7px; height:7px; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--cyan); animation: lbPulse 1.4s ease-in-out infinite; }
  @keyframes lbPulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }

  footer{
    text-align:center; padding:34px 20px 40px; border-top:1px solid var(--line);
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted); letter-spacing:0.05em;
  }
  footer a{ color:var(--cyan); text-decoration:none; }
  footer .row{ margin-top:6px; }

  @media (max-width: 640px){
    header{ flex-wrap:wrap; justify-content:center; gap:14px; text-align:center; }
    .nav-menu{ justify-content:center; }
    .socials{ justify-content:center; }
    .lb-frame iframe{ height:700px; }
  }
</style>
</head>
