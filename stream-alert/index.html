<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Stream Alerts | AdhemSwag</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link id="gfonts-link"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Rajdhani:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #05070a;
            --panel: #0b0f12;
            --panel-alpha: 0.96;
            --accent: #11d9f7;
            --accent-rgb: 17, 217, 247;
            --muted: #6b7a80;
            --muted-light: #9fb6bd;
            --white: #eaf6f8;
            --danger: #ff3b3b;

            --font-title: 'Rajdhani', Arial, sans-serif;
            --font-body: 'Inter', Arial, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;

            --duration: 12000ms;
            --alert-scale: 1;
            --alert-radius: 14px;
            --glow: 1;

            --pos-left: 50%;
            --pos-top: 50%;
            --pos-tx: -50%;
            --pos-ty: -50%;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: var(--font-body);
        }

        /* Dashboard stage backgrounds (only active in ?dashboard=1 or ?test=1) */
        body.stage-checker {
            background-color: #0b0f14;
            background-image:
                linear-gradient(45deg, rgba(255, 255, 255, .04) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255, 255, 255, .04) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, .04) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, .04) 75%);
            background-size: 28px 28px;
            background-position: 0 0, 0 14px, 14px -14px, -14px 0;
        }

        body.stage-dark {
            background: radial-gradient(circle at 50% 35%, #111924 0%, #05070a 75%);
        }

        body.stage-stream {
            background:
                radial-gradient(circle at 20% 20%, rgba(17, 217, 247, .12), transparent 45%),
                radial-gradient(circle at 80% 75%, rgba(255, 59, 59, .10), transparent 45%),
                linear-gradient(160deg, #0d131a 0%, #070a0e 60%, #0c1016 100%);
            background-image: url("https://i.imgur.com/7QuZlQb.png");
            background-size: cover;
            background-position: center;
        }

        #stream-mock-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            display: none;
            pointer-events: none;
            overflow: hidden;
        }

        body.stage-stream #stream-mock-bg {
            display: block;
        }

        #stream-mock-bg iframe,
        #stream-mock-bg video {
            width: 100%;
            height: 100%;
            border: 0;
            object-fit: cover;
            pointer-events: none;
        }

        #stream-mock-note {
            position: fixed;
            left: 16px;
            bottom: 16px;
            z-index: 5;
            padding: 6px 10px;
            border-radius: 7px;
            background: rgba(5, 7, 10, .86);
            border: 1px solid rgba(17, 217, 247, .25);
            color: #9fb6bd;
            font: 600 11px 'JetBrains Mono', monospace;
            display: none;
        }

        /* ================= ALERT OVERLAY ================= */
        #alert {
            z-index: 10;
            position: absolute;
            left: var(--pos-left);
            top: var(--pos-top);
            transform: translate(var(--pos-tx), calc(var(--pos-ty) + 22px)) scale(calc(var(--alert-scale) * .88));
            width: min(860px, 92vw);
            padding: 26px 30px;
            border: 1px solid rgba(var(--accent-rgb), .28);
            border-radius: var(--alert-radius);
            background:
                radial-gradient(circle at 18% 50%, rgba(var(--accent-rgb), .13), transparent 54%),
                linear-gradient(135deg, rgba(var(--panel-rgb, 5, 7, 10), var(--panel-alpha)) 0%, rgba(11, 15, 18, var(--panel-alpha)) 100%);
            box-shadow:
                0 22px 60px rgba(0, 0, 0, .75),
                0 0 calc(36px * var(--glow)) rgba(var(--accent-rgb), .2),
                inset 0 0 calc(28px * var(--glow)) rgba(var(--accent-rgb), .06);
            color: var(--white);
            opacity: 0;
            visibility: hidden;
            overflow: hidden;
            transition:
                opacity .42s cubic-bezier(.16, 1, .3, 1),
                transform .48s cubic-bezier(.16, 1, .3, 1),
                visibility 0s linear .48s;
        }

        #alert[data-anim="slide-left"] {
            transform: translate(calc(var(--pos-tx) + 60px), var(--pos-ty)) scale(var(--alert-scale));
        }

        #alert[data-anim="slide-down"] {
            transform: translate(var(--pos-tx), calc(var(--pos-ty) - 40px)) scale(var(--alert-scale));
        }

        #alert[data-anim="zoom"] {
            transform: translate(var(--pos-tx), var(--pos-ty)) scale(calc(var(--alert-scale) * .62));
        }

        #alert.show {
            opacity: 1;
            visibility: visible;
            transform: translate(var(--pos-tx), var(--pos-ty)) scale(var(--alert-scale));
            transition:
                opacity .42s cubic-bezier(.16, 1, .3, 1),
                transform .48s cubic-bezier(.16, 1, .3, 1),
                visibility 0s linear 0s;
            animation: cardPulse 2.2s ease-in-out 2;
        }

        #alert[data-layout="right"] .alert-inner {
            flex-direction: row-reverse;
        }

        #alert[data-layout="center"] .alert-inner {
            flex-direction: column;
            text-align: center;
            gap: 18px;
        }

        #alert[data-layout="center"] .alert-body {
            text-align: center;
        }

        #alert[data-layout="center"] .meta-row {
            justify-content: center;
        }

        #alert.hide-image .item-frame,
        #alert.hide-kicker .kicker,
        #alert.hide-viewer .viewer,
        #alert.hide-cost .cost,
        #alert.hide-brand .brand-tag,
        #alert.hide-progress .progress-track,
        #alert.hide-corners .hud-corner,
        #alert.hide-flash .alert-flash {
            display: none !important;
        }

        /* Diagonal cyber shimmer sweep strictly clipped inside the alert box */
        .alert-flash {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            overflow: hidden;
            clip-path: inset(0 round var(--alert-radius));
            pointer-events: none;
            z-index: 3;
        }

        .alert-flash::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(115deg,
                    transparent 20%,
                    rgba(var(--accent-rgb), .18) 48%,
                    rgba(234, 246, 248, .24) 50%,
                    rgba(var(--accent-rgb), .18) 52%,
                    transparent 80%);
            transform: translateX(-130%);
            pointer-events: none;
        }

        #alert.show .alert-flash::before {
            animation: shimmerSweep 1.15s cubic-bezier(.2, .8, .2, 1) .12s 1 forwards;
        }

        .hud-corner {
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: var(--accent);
            border-style: solid;
            pointer-events: none;
            opacity: .85;
            z-index: 2;
        }

        .hud-tl {
            top: 10px;
            left: 10px;
            border-width: 2px 0 0 2px;
            border-top-left-radius: 4px;
        }

        .hud-tr {
            top: 10px;
            right: 10px;
            border-width: 2px 2px 0 0;
            border-top-right-radius: 4px;
        }

        .hud-bl {
            bottom: 10px;
            left: 10px;
            border-width: 0 0 2px 2px;
            border-bottom-left-radius: 4px;
        }

        .hud-br {
            bottom: 10px;
            right: 10px;
            border-width: 0 2px 2px 0;
            border-bottom-right-radius: 4px;
        }

        .alert-inner {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 26px;
        }

        .item-frame {
            position: relative;
            flex: 0 0 148px;
            width: 148px;
            height: 148px;
            border-radius: calc(var(--alert-radius) * .85);
            border: 1px solid rgba(var(--accent-rgb), .35);
            background:
                radial-gradient(circle at 50% 50%, rgba(var(--accent-rgb), .22), rgba(5, 7, 10, .92) 74%);
            box-shadow:
                0 0 calc(28px * var(--glow)) rgba(var(--accent-rgb), .18),
                inset 0 0 20px rgba(var(--accent-rgb), .08);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow: hidden;
            opacity: 0;
            transform: scale(.75) rotate(-4deg);
            transition: opacity .45s ease .08s, transform .55s cubic-bezier(.22, 1.28, .36, 1) .08s;
        }

        #alert.show .item-frame {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        .item-frame::after {
            content: '';
            position: absolute;
            inset: -40%;
            background: conic-gradient(from 0deg, transparent 0deg 290deg, rgba(var(--accent-rgb), .26) 330deg, transparent 360deg);
            animation: spinAura 5s linear infinite;
            pointer-events: none;
        }

        .item-img {
            position: relative;
            z-index: 1;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, .7)) drop-shadow(0 0 12px rgba(var(--accent-rgb), .28));
            animation: floatItem 3s ease-in-out infinite;
        }

        .item-img[hidden] {
            display: none;
        }

        .item-fallback {
            position: relative;
            z-index: 1;
            width: 82px;
            height: 82px;
            color: var(--accent);
            filter: drop-shadow(0 0 14px rgba(var(--accent-rgb), .45));
            animation: floatItem 3s ease-in-out infinite;
        }

        .item-fallback[hidden] {
            display: none;
        }

        .alert-body {
            flex: 1 1 auto;
            min-width: 0;
            text-align: left;
        }

        .kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font: 700 13px var(--font-mono);
            letter-spacing: .2em;
            color: var(--accent);
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity .35s ease .12s, transform .4s ease .12s;
        }

        #alert.show .kicker {
            opacity: 1;
            transform: translateY(0);
        }

        .kicker-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            animation: dotBlink 1.1s ease-in-out infinite;
        }

        .viewer {
            margin-top: 8px;
            font: 600 15px var(--font-mono);
            letter-spacing: .04em;
            color: var(--muted-light);
            opacity: 0;
            transform: translateY(10px);
            transition: opacity .38s ease .18s, transform .42s ease .18s;
        }

        .viewer strong {
            color: var(--white);
            font-weight: 700;
        }

        #alert.show .viewer {
            opacity: 1;
            transform: translateY(0);
        }

        .reward {
            margin-top: 6px;
            font: 700 clamp(24px, 3.6vw, 44px)/1.08 var(--font-title);
            letter-spacing: .02em;
            text-transform: uppercase;
            color: var(--white);
            overflow-wrap: anywhere;
            text-shadow: 0 0 22px rgba(var(--accent-rgb), .24);
            opacity: 0;
            transform: translateY(12px);
            transition: opacity .42s ease .24s, transform .45s ease .24s;
        }

        #alert.show .reward {
            opacity: 1;
            transform: translateY(0);
        }

        .meta-row {
            margin-top: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity .42s ease .30s, transform .45s ease .30s;
        }

        #alert.show .meta-row {
            opacity: 1;
            transform: translateY(0);
        }

        .cost {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 13px;
            border-radius: 6px;
            background: rgba(var(--accent-rgb), .14);
            border: 1px solid rgba(var(--accent-rgb), .38);
            font: 700 14px var(--font-mono);
            color: var(--accent);
            letter-spacing: .08em;
            box-shadow: 0 0 16px rgba(var(--accent-rgb), .14);
        }

        .brand-tag {
            font: 600 12px var(--font-mono);
            letter-spacing: .12em;
            color: var(--muted);
            text-transform: uppercase;
        }

        .progress-track {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 3px;
            background: rgba(var(--accent-rgb), .12);
            overflow: hidden;
        }

        .progress-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(var(--accent-rgb), .45), var(--accent));
            box-shadow: 0 0 12px var(--accent);
            transform-origin: left center;
            transform: scaleX(0);
        }

        #alert.show .progress-bar {
            animation: timerBar var(--duration) linear forwards;
        }

        /* ================= STUDIO DASHBOARD (?dashboard=1 or ?test=1) ================= */
        #studio {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            display: none;
            font-family: 'Inter', Arial, sans-serif;
        }

        #studio.visible {
            display: block;
        }

        .studio-topbar {
            position: fixed;
            top: 14px;
            left: 14px;
            right: 400px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            pointer-events: none;
            transition: right .25s ease;
        }

        #studio.panel-hidden .studio-topbar {
            right: 14px;
        }

        .studio-pill {
            pointer-events: auto;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(5, 7, 10, .92);
            border: 1px solid rgba(17, 217, 247, .28);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .55);
            backdrop-filter: blur(12px);
            color: #eaf6f8;
            font: 600 12px 'Inter', sans-serif;
        }

        .obs-link-box {
            flex: 1 1 280px;
            max-width: 680px;
            min-width: 220px;
        }

        .obs-link-label {
            font: 700 10px 'JetBrains Mono', monospace;
            letter-spacing: .1em;
            color: #11d9f7;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .obs-link-input {
            flex: 1 1 auto;
            min-width: 0;
            background: #0b0f12;
            border: 1px solid rgba(17, 217, 247, .2);
            border-radius: 6px;
            padding: 5px 8px;
            color: #9fb6bd;
            font: 500 11px 'JetBrains Mono', monospace;
            outline: none;
        }

        .studio-sidebar {
            pointer-events: auto;
            position: fixed;
            top: 14px;
            right: 14px;
            bottom: 14px;
            width: 372px;
            max-width: calc(100vw - 28px);
            background: rgba(5, 7, 10, .95);
            border: 1px solid rgba(17, 217, 247, .3);
            border-radius: 14px;
            box-shadow: 0 22px 60px rgba(0, 0, 0, .75), 0 0 28px rgba(17, 217, 247, .12);
            backdrop-filter: blur(14px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform .25s ease, opacity .25s ease;
        }

        #studio.panel-hidden .studio-sidebar {
            transform: translateX(calc(100% + 24px));
            opacity: 0;
            pointer-events: none;
        }

        .studio-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 13px 15px;
            border-bottom: 1px solid rgba(17, 217, 247, .14);
        }

        .studio-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font: 700 13px 'JetBrains Mono', monospace;
            letter-spacing: .12em;
            color: #11d9f7;
            text-transform: uppercase;
        }

        .studio-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: 8px 12px;
            background: rgba(11, 15, 18, .7);
            border-bottom: 1px solid rgba(17, 217, 247, .12);
        }

        .studio-tab {
            appearance: none;
            border: 1px solid transparent;
            background: transparent;
            color: #809197;
            padding: 7px 6px;
            border-radius: 7px;
            font: 700 11px 'JetBrains Mono', monospace;
            letter-spacing: .05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all .18s ease;
        }

        .studio-tab.active {
            color: #11d9f7;
            background: rgba(17, 217, 247, .12);
            border-color: rgba(17, 217, 247, .28);
        }

        .studio-body {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .studio-pane {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .studio-pane.active {
            display: flex;
        }

        .sec-label {
            font: 700 10px 'JetBrains Mono', monospace;
            letter-spacing: .14em;
            color: #6b7a80;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .ctrl-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .ctrl-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .ctrl-field.full {
            grid-column: 1 / -1;
        }

        .ctrl-field label {
            display: flex;
            justify-content: space-between;
            font: 600 10px 'JetBrains Mono', monospace;
            letter-spacing: .07em;
            color: #9fb6bd;
            text-transform: uppercase;
        }

        .ctrl-field input[type="text"],
        .ctrl-field input[type="number"],
        .ctrl-field select {
            width: 100%;
            background: #0b0f12;
            border: 1px solid rgba(17, 217, 247, .22);
            border-radius: 7px;
            padding: 7px 9px;
            color: #eaf6f8;
            font: 500 12px 'Inter', sans-serif;
            outline: none;
        }

        .ctrl-field input[type="text"]:focus,
        .ctrl-field input[type="number"]:focus,
        .ctrl-field select:focus {
            border-color: #11d9f7;
        }

        .ctrl-field input[type="color"] {
            width: 100%;
            height: 32px;
            padding: 2px;
            background: #0b0f12;
            border: 1px solid rgba(17, 217, 247, .22);
            border-radius: 7px;
            cursor: pointer;
        }

        .ctrl-field input[type="range"] {
            width: 100%;
            accent-color: #11d9f7;
            cursor: pointer;
        }

        .check-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .ctrl-check {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 9px;
            border-radius: 7px;
            background: rgba(11, 15, 18, .8);
            border: 1px solid rgba(17, 217, 247, .12);
            font: 600 11px 'JetBrains Mono', monospace;
            color: #cde0e5;
            cursor: pointer;
        }

        .ctrl-check input {
            accent-color: #11d9f7;
            cursor: pointer;
        }

        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .s-btn {
            appearance: none;
            border: 1px solid rgba(17, 217, 247, .35);
            background: rgba(11, 15, 18, .92);
            color: #11d9f7;
            padding: 7px 11px;
            border-radius: 8px;
            font: 700 11px 'JetBrains Mono', monospace;
            letter-spacing: .06em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background .18s ease, transform .15s ease;
        }

        .s-btn.sm {
            padding: 5px 8px;
            font-size: 10px;
            border-radius: 6px;
        }

        .s-btn.primary {
            background: rgba(17, 217, 247, .18);
            color: #eaf6f8;
            border-color: #11d9f7;
        }

        .s-btn:hover {
            background: rgba(17, 217, 247, .22);
            transform: translateY(-1px);
        }

        .s-btn.needs-unlock {
            border-color: #11d9f7;
            background: rgba(17, 217, 247, .24);
            color: #eaf6f8;
            animation: cardPulse 1.3s ease-in-out infinite;
        }

        .studio-footer {
            padding: 11px 14px;
            border-top: 1px solid rgba(17, 217, 247, .14);
            background: rgba(11, 15, 18, .85);
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .studio-footer .s-btn {
            flex: 1 1 auto;
            text-align: center;
        }

        #studio-float-toggle {
            pointer-events: auto;
            position: fixed;
            right: 16px;
            bottom: 16px;
            display: none;
        }

        #studio.panel-hidden #studio-float-toggle {
            display: inline-flex;
        }

        /* Store Claim Stats Pop-up Modal */
        #stats-modal {
            pointer-events: auto;
            position: fixed;
            inset: 0;
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(3, 5, 8, .78);
            backdrop-filter: blur(8px);
        }

        #stats-modal.open {
            display: flex;
        }

        .stats-dialog {
            width: min(760px, 95vw);
            max-height: 86vh;
            background: rgba(5, 7, 10, .97);
            border: 1px solid rgba(17, 217, 247, .35);
            border-radius: 14px;
            box-shadow: 0 28px 80px rgba(0, 0, 0, .85), 0 0 36px rgba(17, 217, 247, .16);
            color: #eaf6f8;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .stats-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 14px 18px;
            border-bottom: 1px solid rgba(17, 217, 247, .16);
            background: rgba(11, 15, 18, .85);
        }

        .stats-title {
            font: 700 14px 'JetBrains Mono', monospace;
            letter-spacing: .12em;
            color: #11d9f7;
            text-transform: uppercase;
        }

        .stats-body {
            padding: 16px 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .stats-kpis {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
        }

        .kpi-card {
            padding: 12px;
            border-radius: 10px;

            border: 1px solid rgba(17, 217, 247, .18);

            white-space: nowrap;
        }

        .stats-highlights {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .hl-card {
            padding: 12px 14px;
            border-radius: 10px;
            background: radial-gradient(circle at 0% 0%, rgba(17, 217, 247, .12), rgba(11, 15, 18, .92) 70%);
            border: 1px solid rgba(17, 217, 247, .26);
        }

        .hl-name {
            margin-top: 5px;
            font: 700 18px 'Rajdhani', sans-serif;
            color: #eaf6f8;
            text-transform: uppercase;
            overflow-wrap: anywhere;
        }

        .hl-meta {
            margin-top: 4px;
            font: 600 11px 'JetBrains Mono', monospace;
            color: #11d9f7;
        }

        .stats-lists {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stats-panel {
            padding: 12px;
            border-radius: 10px;
            background: rgba(11, 15, 18, .75);
            border: 1px solid rgba(17, 217, 247, .14);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stats-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 6px 8px;
            border-radius: 6px;
            background: rgba(5, 7, 10, .65);
            font: 500 12px 'Inter', sans-serif;
        }

        .stats-row-name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #eaf6f8;
        }

        .stats-row-val {
            flex-shrink: 0;
            font: 700 11px 'JetBrains Mono', monospace;
            color: #11d9f7;
        }

        @media (max-width: 660px) {
            .stats-kpis {
                grid-template-columns: repeat(2, 1fr);
            }

            .stats-highlights,
            .stats-lists {
                grid-template-columns: 1fr;
            }
        }

        @keyframes cardPulse {

            0%,
            100% {
                box-shadow: 0 22px 60px rgba(0, 0, 0, .75), 0 0 calc(28px * var(--glow)) rgba(var(--accent-rgb), .2), inset 0 0 calc(24px * var(--glow)) rgba(var(--accent-rgb), .04);
            }

            50% {
                box-shadow: 0 22px 60px rgba(0, 0, 0, .75), 0 0 calc(56px * var(--glow)) rgba(var(--accent-rgb), .48), inset 0 0 calc(34px * var(--glow)) rgba(var(--accent-rgb), .09);
            }
        }

        @keyframes shimmerSweep {
            0% {
                transform: translateX(-130%);
            }

            100% {
                transform: translateX(130%);
            }
        }

        @keyframes floatItem {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        @keyframes spinAura {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes dotBlink {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: .4;
                transform: scale(.75);
            }
        }

        @keyframes timerBar {
            from {
                transform: scaleX(1);
            }

            to {
                transform: scaleX(0);
            }
        }

        @media (max-width: 720px) {
            .studio-topbar {
                right: 14px;
            }

            .studio-sidebar {
                top: auto;
                height: 55vh;
                width: calc(100vw - 28px);

</head>

    <script>
        const endpoint = 'https://lpmocfdfpebcaseffugg.supabase.co/functions/v1/stream-reward-alert';
        const CFG_KEY = 'adhemswag_stream_alert_cfg_v2';
        const DEFAULT_CFG = {
            accent: '#11d9f7',
            panel: '#05070a',
            text: '#eaf6f8',
            opacity: 96,
            fontTitle: 'Rajdhani',
            fontMono: 'JetBrains Mono',
            layout: 'left',
            anim: 'pop',
            radius: 14,
            glow: 100,
            pos: 'center',
            scale: 1,
            durationSec: 10,
            showImage: true,
            showKicker: true,
            showViewer: true,
            showCost: true,
            showBrand: true,
            showProgress: true,
            showCorners: true,
            showFlash: true,
            kickerText: 'NEW STORE PURCHASE',
            brandText: 'ADHEMSWAG.COM/STORE',
            sound: 'premium',
            volume: 58,
            mute: false
        };

        const params = new URLSearchParams(location.search);
        const isStudio = params.get('dashboard') === '1' || params.get('test') === '1';

        function decodeCfgParam(raw) {
            try {
                const b64 = raw.replace(/-/g, '+').replace(/_/g, '/');
                const json = decodeURIComponent(escape(atob(b64)));
                const parsed = JSON.parse(json);
                return parsed && typeof parsed === 'object' ? parsed : null;
            } catch (e) {
                return null;
            }
        }

        function encodeCfgParam(obj) {
            const diff = {};
            for (const key of Object.keys(DEFAULT_CFG)) {
                if (obj[key] !== DEFAULT_CFG[key]) diff[key] = obj[key];
            }
            if (!Object.keys(diff).length) return '';
            const json = JSON.stringify(diff);
            return btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        let cfg = { ...DEFAULT_CFG };
        const urlCfg = params.get('c') ? decodeCfgParam(params.get('c')) : null;
        if (urlCfg) {
            cfg = { ...DEFAULT_CFG, ...urlCfg };
        } else {
            try {
                const saved = JSON.parse(localStorage.getItem(CFG_KEY) || '{}');
                if (saved && typeof saved === 'object') {
                    cfg = { ...DEFAULT_CFG, ...saved };
                    if (saved.durationSec === 12) cfg.durationSec = 10;
                    if (saved.sound === 'cyber' && Number(saved.volume) === 100) {
                        cfg.sound = 'premium';
                        cfg.volume = 58;
                    }
                }
            } catch (e) { }
        }

        const box = document.getElementById('alert');
        const viewer = document.getElementById('viewer');
        const reward = document.getElementById('reward');
        const cost = document.getElementById('cost');
        const kickerTextEl = document.getElementById('kicker-text');
        const brandTagEl = document.getElementById('brand-tag');
        const itemImg = document.getElementById('item-img');
        const itemFallback = document.getElementById('item-fallback');
        const progressBar = document.getElementById('progress-bar');
        const gfontsLink = document.getElementById('gfonts-link');

        function hexToRgb(hex) {
            const clean = String(hex || '').replace('#', '');
            if (clean.length !== 6) return '17, 217, 247';
            const r = parseInt(clean.slice(0, 2), 16);
            const g = parseInt(clean.slice(2, 4), 16);
            const b = parseInt(clean.slice(4, 6), 16);
            return [r, g, b].some(Number.isNaN) ? '17, 217, 247' : `${r}, ${g}, ${b}`;
        }

        function updateGoogleFonts() {
            const families = new Set(['Inter:wght@400;500;600;700', 'JetBrains+Mono:wght@500;700', 'Rajdhani:wght@600;700']);
            [cfg.fontTitle, cfg.fontMono].forEach((f) => {
                if (!f) return;
                families.add(f.replace(/ /g, '+') + ':wght@400;500;600;700');
            });
            const href = 'https://fonts.googleapis.com/css2?' + [...families].map(f => 'family=' + f).join('&') + '&display=swap';
            if (gfontsLink.getAttribute('href') !== href) gfontsLink.setAttribute('href', href);
        }

        const POS_MAP = {
            'center': ['50%', '50%', '-50%', '-50%'],
            'top-center': ['50%', '28px', '-50%', '0%'],
            'bottom-center': ['50%', 'calc(100% - 28px)', '-50%', '-100%'],
            'top-left': ['28px', '28px', '0%', '0%'],
            'top-right': ['calc(100% - 28px)', '28px', '-100%', '0%'],
            'bottom-left': ['28px', 'calc(100% - 28px)', '0%', '-100%'],
            'bottom-right': ['calc(100% - 28px)', 'calc(100% - 28px)', '-100%', '-100%']
        };

        function buildObsUrl() {
            const base = location.origin === 'null' ? location.href.split('?')[0] : (location.origin + location.pathname);
            const encoded = encodeCfgParam(cfg);
            return encoded ? `${base}?c=${encoded}` : base;

        function applyConfig(persist = true) {

        function scheduleNotes(ctx) {
            if (cfg.mute || cfg.volume <= 0) return;
            const vol = Math.max(0.01, Math.min(1, cfg.volume / 100));
            const preset = SOUND_PRESETS[cfg.sound] || SOUND_PRESETS.cyber;
            const start = ctx.currentTime + 0.02;

            preset.notes.forEach((frequency, index) => {
                const osc = ctx.createOscillator();
                const sub = ctx.createOscillator();
                const gain = ctx.createGain();
                const at = start + index * preset.step;

                osc.type = preset.type;
                osc.frequency.setValueAtTime(frequency, at);

                sub.type = 'sine';
                sub.frequency.setValueAtTime(frequency * 2, at);

                const premium = cfg.sound === 'premium';
                const peak = premium ? 0.12 * vol : (preset.type === 'square' ? 0.09 * vol : 0.18 * vol);
                const noteLength = premium ? 0.42 : 0.24;
                gain.gain.setValueAtTime(0.0001, at);
                gain.gain.exponentialRampToValueAtTime(peak, at + (premium ? 0.045 : 0.02));
                gain.gain.exponentialRampToValueAtTime(0.0001, at + noteLength);

                const subGain = ctx.createGain();
                subGain.gain.setValueAtTime((premium ? 0.022 : 0.04) * vol, at);
                subGain.gain.exponentialRampToValueAtTime(0.0001, at + (premium ? 0.34 : 0.20));

                osc.connect(gain);
                sub.connect(subGain);
                subGain.connect(gain);
                gain.connect(ctx.destination);

                osc.start(at);
                sub.start(at);
                osc.stop(at + (premium ? 0.44 : 0.25));
                sub.stop(at + (premium ? 0.36 : 0.25));
            });
        }

            function renderStatsAlerts(rawAlerts) {
                const alerts = (rawAlerts || []).slice().sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                if (!alerts.length) {
                    statsBody.innerHTML = '<div class="kpi-sub">No store claims found in data.</div>';
                    return;
                }

                let totalFnc = 0;
                const byUser = new Map();
                const byItem = new Map();

                for (const a of alerts) {
                    const fnc = Number(a.fnc || 0);
                    totalFnc += fnc;
                    const user = (a.viewer || 'Unknown').trim();
                    const item = (a.reward || 'Unknown Reward').trim();

                    const u = byUser.get(user) || { name: user, count: 0, fnc: 0 };
                    u.count += 1;
                    u.fnc += fnc;
                    byUser.set(user, u);

                    const it = byItem.get(item) || { name: item, count: 0, fnc: 0 };
                    it.count += 1;
                    it.fnc += fnc;
                    byItem.set(item, it);
                }

                const topUsers = [...byUser.values()].sort((a, b) => b.count - a.count || b.fnc - a.fnc);
                const topItems = [...byItem.values()].sort((a, b) => b.count - a.count || b.fnc - a.fnc);
                const topBuyer = topUsers[0];
                const mostBought = topItems[0];
                const avgFnc = Math.round(totalFnc / alerts.length);
                const newest = alerts[0];
                const oldest = alerts[alerts.length - 1];
                const spanDays = Math.max(1, Math.round((new Date(newest.created_at) - new Date(oldest.created_at)) / 86400000));

                statsBody.innerHTML = `
                    <div class="stats-kpis">
                        <div class="kpi-card">
                            <div class="kpi-label">Total Claims</div>
                            <div class="kpi-val">${alerts.length.toLocaleString('en-US')}</div>
                            <div class="kpi-sub">${byUser.size} unique buyers</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-label">Total Coins Used</div>
                            <div class="kpi-val">${totalFnc.toLocaleString('en-US')}</div>
                            <div class="kpi-sub">Avg ${avgFnc.toLocaleString('en-US')} FNC</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-label">Last Claim</div>
                            <div class="kpi-val">${escapeHtml(timeAgo(newest.created_at))}</div>
                            <div class="kpi-sub">${escapeHtml(new Date(newest.created_at).toLocaleDateString())}</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-label">Active Span</div>
                            <div class="kpi-val">${spanDays}d</div>
                            <div class="kpi-sub">Since ${escapeHtml(new Date(oldest.created_at).toLocaleDateString())}</div>
                        </div>
                    </div>

                    <div class="stats-highlights">
                        <div class="hl-card">
                            <div class="kpi-label">🏆 Top Buyer (Most Claims)</div>
                            <div class="hl-name">${escapeHtml(topBuyer.name)}</div>
                            <div class="hl-meta">${topBuyer.count} claims · ${topBuyer.fnc.toLocaleString('en-US')} FNC spent</div>
                        </div>
                        <div class="hl-card">
                            <div class="kpi-label">🔥 Most Bought Item</div>
                            <div class="hl-name">${escapeHtml(mostBought.name)}</div>
                            <div class="hl-meta">Bought ${mostBought.count}x · ${mostBought.fnc.toLocaleString('en-US')} FNC total</div>
                        </div>
                    </div>

                    <div class="stats-lists">
                        <div class="stats-panel">
                            <div class="sec-label">Top Buyers Leaderboard</div>
                            ${topUsers.slice(0, 6).map((u, i) => `
                                <div class="stats-row">
                                    <span class="stats-row-name">${i + 1}. ${escapeHtml(u.name)}</span>
                                    <span class="stats-row-val">${u.count}x · ${u.fnc.toLocaleString('en-US')} FNC</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="stats-panel">
                            <div class="sec-label">Top Claimed Items</div>
                            ${topItems.slice(0, 6).map((it, i) => `
                                <div class="stats-row">
                                    <span class="stats-row-name">${i + 1}. ${escapeHtml(it.name)}</span>
                                    <span class="stats-row-val">${it.count}x</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="stats-panel">
                        <div class="sec-label">Recent Claims (${Math.min(8, alerts.length)})</div>
                        ${alerts.slice(0, 8).map(a => `
                            <div class="stats-row">
                                <span class="stats-row-name"><strong>${escapeHtml(a.viewer || 'Viewer')}</strong> — ${escapeHtml(a.reward || 'Reward')}</span>
                                <span class="stats-row-val">${Number(a.fnc || 0).toLocaleString('en-US')} FNC · ${escapeHtml(timeAgo(a.created_at))}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            async function loadStoreStats() {
                statsBody.innerHTML = '<div class="kpi-sub">Fetching live store claims...</div>';
                try {
                    const res = await fetch(endpoint, { cache: 'no-store' });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    renderStatsAlerts(data.alerts || []);
                } catch (err) {
                    const isLocalOrigin = location.origin !== 'https://adhemswag.com';
                    const hint = isLocalOrigin
                        ? 'Blocked by browser CORS on ' + escapeHtml(location.origin || 'file:///') + ' (server only allows https://adhemswag.com).'
                        : escapeHtml(err.message);
                    statsBody.innerHTML = `
                        <div class="kpi-sub" style="color:#ff3b3b;white-space:normal;line-height:1.45">Failed to load live stats: ${hint}</div>
                        <div class="stats-panel">
                            <div class="sec-label">Load Local JSON Instead (works on file:///)</div>
                            <div class="chip-row">
                                <button type="button" class="s-btn sm primary" id="stats-file-btn">📁 Choose JSON File</button>
                                <input type="file" id="stats-file-input" accept=".json,application/json" hidden>
                                <button type="button" class="s-btn sm" id="stats-parse-btn">Analyze Pasted JSON</button>
                            </div>
                            <textarea id="stats-json-paste" rows="4" placeholder='Paste JSON from stream-reward-alert here ({"ok":true,"alerts":[...]})' style="width:100%;background:#05070a;border:1px solid rgba(17,217,247,.24);border-radius:7px;padding:8px;color:#eaf6f8;font:11px 'JetBrains Mono',monospace;resize:vertical"></textarea>
                        </div>
                    `;
                    const fileInput = el('stats-file-input');
                    el('stats-file-btn').addEventListener('click', () => fileInput.click());
                    fileInput.addEventListener('change', async () => {
                        const f = fileInput.files && fileInput.files[0];
                        if (!f) return;
                        try {
                            const parsed = JSON.parse(await f.text());
                            renderStatsAlerts(Array.isArray(parsed) ? parsed : (parsed.alerts || []));
                        } catch (e) {
                            alert('Invalid JSON file: ' + e.message);
                        }
                    });
                    el('stats-parse-btn').addEventListener('click', () => {
                        try {
                            const parsed = JSON.parse(el('stats-json-paste').value);
                            renderStatsAlerts(Array.isArray(parsed) ? parsed : (parsed.alerts || []));
                        } catch (e) {
                            alert('Invalid JSON: ' + e.message);
                        }
                    });
                }
            }

            el('open-stats-btn').addEventListener('click', () => {
                statsModal.classList.add('open');
                loadStoreStats();
            });
            el('refresh-stats-btn').addEventListener('click', loadStoreStats);
            el('close-stats-btn').addEventListener('click', () => statsModal.classList.remove('open'));
            statsModal.addEventListener('click', (e) => {
                if (e.target === statsModal) statsModal.classList.remove('open');
            });
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && statsModal.classList.contains('open')) {
                    statsModal.classList.remove('open');
                }
            });

            updateTestAudioUI(getAudioContext());
            setTimeout(triggerTestAlert, 500);
        }

        async function poll() {
            if (busy) return;
            busy = true;
            try {
                const response = await fetch(endpoint + '?since=' + encodeURIComponent(since), { cache: 'no-store' });
                if (!response.ok) throw new Error('alert_endpoint_' + response.status);
                const data = await response.json();
                for (const item of (data.alerts || [])) {
                    const key = alertKey(item);
                    if (!seen.has(key)) {
                        rememberAlert(key);
                        show(item);
                    }
                    if (item.created_at && item.created_at > since) since = item.created_at;
                }
            } catch (error) {
                // Keep the last successful cursor so a temporary network error does not lose alerts.
            } finally {
                busy = false;
            }
        }

        setInterval(poll, 2000);
        poll();
    </script>
</body>

</html>
