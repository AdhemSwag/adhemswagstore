<style>
:root{--bg:#05070a;--panel:#0b0f12;--cyan:#11d9f7;--muted:#839399;--white:#eaf6f8;--line:rgba(17,217,247,.17);--ok:#39e58c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white);font-family:Inter,sans-serif}
body{background-image:linear-gradient(rgba(17,217,247,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(17,217,247,.035) 1px,transparent 1px);background-size:42px 42px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px clamp(16px,5vw,64px);border-bottom:1px solid var(--line);background:rgba(5,7,10,.92);position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}
.brand{font:700 18px 'JetBrains Mono',monospace;letter-spacing:.08em;color:var(--white);text-decoration:none}.brand span{color:var(--cyan)}
nav:not(.sidebar){display:flex;flex-wrap:wrap;gap:16px}nav:not(.sidebar) a{font:600 10px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none}nav:not(.sidebar) a:hover,nav:not(.sidebar) a.active{color:var(--cyan)}
main{width:min(1120px,100%);margin:auto;padding:clamp(28px,5vw,58px) 22px 76px;position:relative}main:before{content:'';position:absolute;z-index:0;top:0;left:10%;right:10%;height:260px;pointer-events:none;background:radial-gradient(ellipse at top,rgba(17,217,247,.09),transparent 68%)}main>*{position:relative;z-index:1}
.eyebrow{display:flex;align-items:center;gap:10px;font:10px 'JetBrains Mono',monospace;letter-spacing:.18em;color:#45dff4;text-transform:uppercase}.eyebrow:before{content:'';width:22px;height:1px;background:var(--cyan)}
h1{font:700 clamp(44px,7vw,76px) Rajdhani,sans-serif;line-height:.95;text-transform:uppercase;margin:12px 0}h1 span{color:var(--cyan)}
.lede{max-width:650px;color:#a0b0b5;font-size:14px;line-height:1.8}.hero{padding:0 0 28px;border-bottom:1px solid var(--line);margin-bottom:24px}.hero-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px}.hero-chip{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border:1px solid rgba(17,217,247,.18);background:rgba(8,16,20,.8);color:#a9c1c7;font:9px 'JetBrains Mono',monospace;letter-spacing:.1em}.hero-chip i{display:block;width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px rgba(17,217,247,.55)}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:30px 0 14px}.section-head h2{font:700 23px Rajdhani,sans-serif;letter-spacing:.08em;margin:0}.section-head p{font:9px 'JetBrains Mono',monospace;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.summary{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 28px}.pill{border:1px solid var(--line);background:rgba(17,217,247,.04);padding:9px 12px;color:#b7c8cd;font:10px 'JetBrains Mono',monospace;letter-spacing:.04em}
#status{margin:20px 0 22px;padding:18px 20px;border:1px solid rgba(17,217,247,.22);background:linear-gradient(110deg,rgba(17,217,247,.07),rgba(11,15,18,.94) 56%);color:#a8b9be;font-size:12px;line-height:1.8;box-shadow:0 12px 35px rgba(0,0,0,.16)}#status strong{color:var(--white)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.mission{border:1px solid rgba(17,217,247,.17);background:linear-gradient(145deg,rgba(13,19,23,.98),rgba(6,10,13,.98));padding:24px;min-width:0;position:relative;overflow:hidden;transition:border-color .2s ease,transform .2s ease;box-shadow:0 16px 42px rgba(0,0,0,.18)}.mission:before{content:'';position:absolute;top:0;left:0;width:54px;height:2px;background:var(--cyan);opacity:.8}.mission:hover{border-color:rgba(17,217,247,.4);transform:translateY(-2px)}.mission.done{border-color:rgba(57,229,140,.45)}.mission.done:before{background:var(--ok)}.mission-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.tag{font:10px 'JetBrains Mono',monospace;color:var(--cyan);text-transform:uppercase;letter-spacing:.12em}.status{font:10px 'JetBrains Mono',monospace;color:var(--muted);text-transform:uppercase}.done .status{color:var(--ok)}
h2{font:700 27px Rajdhani,sans-serif;text-transform:uppercase;margin:13px 0 7px}.desc{font-size:13px;color:var(--muted);line-height:1.65;min-height:42px}
.rewards{display:flex;gap:9px;margin:20px 0}.reward{padding:9px 12px;border:1px solid var(--line);background:rgba(17,217,247,.035);font:700 12px 'JetBrains Mono',monospace}.reward.xp{color:var(--cyan)}.reward.fnc{color:#e8f5a5}
.progress-label{display:flex;justify-content:space-between;gap:10px;font:10px 'JetBrains Mono',monospace;color:var(--muted);margin:22px 0 8px}.bar{height:8px;background:#151e22;border:1px solid rgba(17,217,247,.1);overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#0b91a7,var(--cyan));width:0;transition:width .25s ease}.done .bar span{background:var(--ok)}
.note{font-size:10px;line-height:1.8;color:#73858b;margin-top:18px}.rules-strip{margin-top:24px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.rule{border:1px solid rgba(17,217,247,.12);padding:14px;background:rgba(9,13,16,.8)}.rule b{display:block;color:#dce9ec;font:10px 'JetBrains Mono',monospace;letter-spacing:.06em;margin-bottom:6px}.rule span{color:var(--muted);font-size:11px;line-height:1.6}
button,.cta{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:11px 16px;background:var(--cyan);border:0;color:#031216;text-decoration:none;font:700 11px 'JetBrains Mono',monospace;text-transform:uppercase;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
@media(max-width:700px){.grid{grid-template-columns:1fr}.rules-strip{grid-template-columns:1fr}main{padding-top:34px}.desc{min-height:0}.mission{padding:20px}.section-head{align-items:flex-start;flex-direction:column}}

/* Shared AdhemSwag site shell for Missions */

.missions-header-account{border:1px solid rgba(17,217,247,.22);padding:10px 12px;border-radius:5px}

@media(max-width:900px){.missions-header-links{gap:10px}.missions-header-links a{font-size:9px}.missions-header-account{display:none}}
@media(max-width:700px){.missions-site-header{min-height:58px;padding:8px 12px;gap:12px}.missions-header-brand{font-size:14px}.missions-header-links{display:none}main{padding-top:28px!important}body{padding-bottom:90px!important}footer .footer-inner{align-items:flex-start;flex-direction:column}footer .footer-socials{gap:14px}}

<style id="adhem-shared-sidebar">.sidebar{

  }

    color:rgba(107,122,128,0.6); margin:16px 10px 6px;
  }
  .sidebar-brand{
    display:flex; align-items:center; justify-content:center; padding:10px 8px 20px;
  }

  }

  .sidebar-link{
    display:flex; align-items:center; gap:12px;

</style>
