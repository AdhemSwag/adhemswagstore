<script>
  (function(){
    const watchConnect = localStorage.getItem('adhem_twitch_watch_connect') === '1';
    const params = new URLSearchParams(window.location.search);
    const oauthCode = params.get('code');
    const oauthError = params.get('error') || params.get('error_description');
    const hash = window.location.hash || '';
    const oauthHash = /(?:^|[#&])(access_token|provider_token|provider_refresh_token|refresh_token|code|error)=/i.test(hash);

    // Twitch/Supabase may return the OAuth callback in either PKCE query form
    // (?code=...) or hash-token form (#access_token=...&provider_token=...).
    // In both cases, keep the root loader alive long enough for auth.js to
    // capture the provider token and finish the admin callback.
    if (watchConnect && (oauthCode || oauthHash || oauthError)) {
      // This page is only an OAuth handoff for Twitch Watch Tracking.
      // Do not show the normal AdhemSwag loading screen during this callback.
      const loader = document.getElementById('adhemRootLoader');
      if (loader) loader.remove();
      // auth.js owns the provider-token capture. This is only a safety fallback
      // if the callback capture cannot complete.
      setTimeout(function(){
        window.location.replace('/admin/');
      }, 8000);
      return;
    }

    if (watchConnect) {
      // No OAuth callback is present: this is a stale connection flag.
      localStorage.removeItem('adhem_twitch_watch_connect');
    }

    setTimeout(function(){
      window.location.replace('/dashboard/' + window.location.search + window.location.hash);
    }, 2000);
  })();
</script>
