<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,follow">
<title>AdhemSwag</title>
<link rel="canonical" href="https://adhemswag.com/dashboard/">
<style>
  html,body{margin:0;width:100%;height:100%;background:#040608;overflow:hidden}
  #adhemRootLoader{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(4,6,8,.985)}
  .adhem-root-loader-card{width:min(420px,80vw);text-align:center;transform:translateY(-1vh)}
  .adhem-root-loader-logo{display:block;width:210px;height:210px;object-fit:contain;margin:0 auto 15px;filter:drop-shadow(0 0 8px rgba(17,217,247,.3));animation:adhemRootPulse 1.25s ease-in-out infinite}
  .adhem-root-loader-label{font:700 14px 'JetBrains Mono',monospace;letter-spacing:.22em;color:#8fa1a7;margin-bottom:10px}
  .adhem-root-loader-dots{display:inline-block;width:18px;text-align:left;animation:adhemRootDots 1s steps(4,end) infinite}
  .adhem-root-loader-track{height:4px;width:100%;overflow:hidden;background:#11191d;border:1px solid rgba(17,217,247,.12);box-sizing:border-box}
  .adhem-root-loader-track i{display:block;height:100%;width:38%;background:#11D9F7;box-shadow:0 0 9px rgba(17,217,247,.55);animation:adhemRootBar 1.05s ease-in-out infinite}
  @keyframes adhemRootPulse{0%,100%{transform:scale(.96);opacity:.82}50%{transform:scale(1.03);opacity:1}}
  @keyframes adhemRootDots{0%{width:0}100%{width:18px}}
  @keyframes adhemRootBar{0%{transform:translateX(-110%)}100%{transform:translateX(290%)}}
  @media(max-width:480px){.adhem-root-loader-logo{width:170px;height:170px}.adhem-root-loader-card{width:min(330px,78vw)}}
  @media(prefers-reduced-motion:reduce){.adhem-root-loader-logo,.adhem-root-loader-track i,.adhem-root-loader-dots{animation:none}}
</style>
</head>
<body>
<div id="adhemRootLoader" aria-label="Loading">
  <div class="adhem-root-loader-card">
    <img class="adhem-root-loader-logo" alt="AdhemSwag" src="/apple-touch-icon.png">
    <div class="adhem-root-loader-label">LOADING<span class="adhem-root-loader-dots">...</span></div>
    <div class="adhem-root-loader-track"><i></i></div>
  </div>
</div>
<script>
  setTimeout(function(){
    window.location.replace('/dashboard/' + window.location.search + window.location.hash);
  }, 3200);
</script>
</body>
</html>
