name: Update Leaderboard

on:
  schedule:
    - cron: '0 * * * *'   # every hour, at minute 0
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Update leaderboard
        env:
          STREAMELEMENTS_JWT: ${{ secrets.STREAMELEMENTS_JWT }}
          STREAMELEMENTS_CHANNEL_ID: ${{ secrets.STREAMELEMENTS_CHANNEL_ID }}
        run: python scripts/update_leaderboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "actions@github.com"
          git add leaderboard/data.json
          git diff --staged --quiet || git commit -m "Auto-update leaderboard data"
          git push
