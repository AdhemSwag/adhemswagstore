name: Fix social links and footer visibility
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-social-links.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update social links and footer CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').rglob('index.html'):
              if '.git' in p.parts: continue
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'href="https://x\.com/[^\"]*" aria-label="X"','href="https://x.com/AdhemSwag" aria-label="X"',s)
              s=re.sub(r'\.footer-socials a\{[^}]*\}','.footer-socials a{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border:1px solid var(--cyan);color:#11D9F7 !important;text-decoration:none;transition:all .2s ease;opacity:1;}',s)
              s=re.sub(r'\.footer-socials svg\{[^}]*\}','.footer-socials svg{width:22px !important;height:22px !important;min-width:22px;min-height:22px;display:block;fill:#11D9F7 !important;color:#11D9F7 !important;opacity:1 !important;}',s)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git rm .github/workflows/fix-social-links.yml
          git commit -m "Fix X link and improve footer social icons" || exit 0
          git push
