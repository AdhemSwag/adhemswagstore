name: Sync footer social logos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-footer-socials.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add social logos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          block = r'''  <div class="footer-socials" aria-label="Social links">
            <a href="https://twitch.tv/AdhemSwag" aria-label="Twitch" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 2 1 6.5V19h6v3l3-3h4l6-6V2H3zm14 10-3 3h-4l-3 3v-3H4V4h13v8z"/><path d="M14 7h2v4h-2zM9 7h2v4H9z"/></svg></a>
            <a href="https://kick.com/adhemswag918" aria-label="Kick" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 2h6v6h2V6h2V4h2V2h6v6h-2v2h-2v2h-2v2h2v2h2v2h2v6h-6v-2h-2v-2h-2v-2H8v6H2V2z"/></svg></a>
            <a href="https://instagram.com/adhemswag" aria-label="Instagram" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7zm5 3.5A4.5 4.5 0 1 1 7.5 12 4.5 4.5 0 0 1 12 7.5zm0 2A2.5 2.5 0 1 0 14.5 12 2.5 2.5 0 0 0 12 9.5zM17.5 6a1 1 0 1 1-1 1 1 1 0 0 1 1-1z"/></svg></a>
            <a href="https://x.com/adhemdwag" aria-label="X" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.77 7.74L23.2 22h-6.25l-4.9-6.1L6.7 22H3.6l7.24-8.28L.8 2h6.4l4.43 5.57L18.9 2zm-1.1 17.9h1.73L6.25 3.98H4.4L17.8 19.9z"/></svg></a>
            <a href="https://tiktok.com/@adhemswagg" aria-label="TikTok" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3c.4 2.1 1.6 3.5 4 3.7V10c-1.5 0-2.8-.4-4-1.1v6.2A6 6 0 1 1 9 9c.4 0 .7 0 1 .1v3.4a2.7 2.7 0 1 0 1.6 2.5V3H15z"/></svg></a>
            <a href="https://t.me/adhemswag" aria-label="Telegram" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.5 3.5 18.2 20c-.25 1.17-.95 1.46-1.93.91l-5.33-3.93-2.57 2.48c-.28.28-.51.51-1.05.51l.38-5.42 9.87-8.92c.43-.38-.09-.6-.67-.22L4.7 13.35l-5.23-1.64c-1.14-.36-1.16-1.14.24-1.69L20.15 2.1c.96-.35 1.8.22 1.35 1.4z"/></svg></a>
            <a href="https://discord.gg/adhemswag" aria-label="Discord" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 5.1A16.2 16.2 0 0 0 15.7 4l-.5 1a14.2 14.2 0 0 0-6.4 0l-.5-1a16.2 16.2 0 0 0-3.8 1.1C2.1 8.1 1.4 12 1.7 15.8a15.7 15.7 0 0 0 4.7 2.4l1.1-1.5c-.6-.2-1.2-.5-1.7-.8l.4-.3c3.3 1.5 6.9 1.5 10.2 0l.4.3c-.5.3-1.1.6-1.7.8l1.1 1.5a15.7 15.7 0 0 0 4.7-2.4c.4-4.5-.7-8.4-1.4-10.7zM8.5 14.2c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2zm7 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2z"/></svg></a>
            <a href="https://youtube.com/adhemswag" aria-label="YouTube" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.5v-7l6.2 3.5-6.2 3.5z"/></svg></a>
          </div>'''

          css = r'''
          .footer-socials{display:flex;justify-content:center;align-items:center;gap:12px;margin:16px 0 4px;}
          .footer-socials a{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);color:var(--cyan);text-decoration:none;transition:all .2s ease;}
          .footer-socials a:hover{background:rgba(17,217,247,.08);border-color:var(--cyan);box-shadow:0 0 12px rgba(17,217,247,.25);}
          .footer-socials svg{width:17px;height:17px;fill:currentColor;}
          '''

          for p in Path('.').rglob('index.html'):
              if '.git' in p.parts:
                  continue
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'\s*<div class="footer-socials"[\s\S]*?</div>\s*', '\n', s, count=1)
              s = s.replace('</footer>', block + '\n</footer>', 1)
              if '.footer-socials{' not in s:
                  s = s.replace('</style>', css + '</style>', 1)
              p.write_text(s, encoding='utf-8')
              print('updated', p)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git rm .github/workflows/sync-footer-socials.yml
          git commit -m "Add social logos to all page footers" || exit 0
          git push
