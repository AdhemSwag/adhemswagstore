name: Update footer social icons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-footer-social-icons.yml'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update all page footers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          allowed = {
              'twitch.tv/adhemswag': 'Twitch',
              'kick.com/adhemswag918': 'Kick',
              'instagram.com/adhemswag': 'Instagram',
              'x.com/adhemdwag': 'X',
              'tiktok.com/@adhemswagg': 'TikTok',
              't.me/adhemswag': 'Telegram',
              'discord.gg/adhemswag': 'Discord',
              'youtube.com/adhemswag': 'YouTube',
          }

          for path in Path('.').rglob('index.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              found = []
              pattern = re.compile(r'<a\s+href=["\'](https?://[^"\']+)["\'][^>]*class=["\']sidebar-link["\'][^>]*>\s*(<svg[\s\S]*?</svg>)', re.I)
              for href, svg in pattern.findall(text):
                  key = re.sub(r'^https?://(www\.)?', '', href, flags=re.I).rstrip('/').lower()
                  if key in allowed and not any(x[0] == key for x in found):
                      svg = re.sub(r'<svg', '<svg aria-hidden="true"', svg, count=1, flags=re.I)
                      found.append((key, svg, allowed[key]))

              if len(found) < 2:
                  print('No sidebar social icons found in', path)
                  continue

              block = '  <div class="footer-socials" aria-label="Social links">\n'
              for key, svg, label in found:
                  block += f'    <a href="https://{key}" aria-label="{label}" target="_blank" rel="noopener">{svg}</a>\n'
              block += '  </div>\n'

              text = re.sub(r'\s*<div class=["\']footer-socials["\'][\s\S]*?</div>\s*', '\n' + block, text, count=1)
              if 'class="footer-socials"' not in text:
                  text = text.replace('</footer>', block + '</footer>', 1)

              css = '''
  .footer-socials{display:flex;justify-content:center;align-items:center;gap:12px;margin:16px 0 4px;}
  .footer-socials a{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);color:var(--cyan);text-decoration:none;transition:all .2s ease;}
  .footer-socials a:hover{background:rgba(17,217,247,.08);border-color:var(--cyan);box-shadow:0 0 12px rgba(17,217,247,.25);}
  .footer-socials svg{width:17px;height:17px;fill:currentColor;}
'''
              if '.footer-socials{' not in text:
                  text = text.replace('</style>', css + '</style>', 1)
              path.write_text(text, encoding='utf-8')
              print('Updated', path, 'with', len(found), 'icons')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Use real social icons in all page footers" || exit 0
          git push
