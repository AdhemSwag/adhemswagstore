name: Add footer social icons
on:
  push:
    paths:
      - '.github/workflows/add-footer-socials.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add social icons to bonuses footer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bonuses/index.html')
          s = p.read_text(encoding='utf-8')
          block = '''\n  <div class="footer-socials" aria-label="Social links">\n    <a href="https://twitch.tv/adhemswag" aria-label="Twitch" target="_blank" rel="noopener"><span>TW</span></a>\n    <a href="https://kick.com/adhemswag918" aria-label="Kick" target="_blank" rel="noopener"><span>K</span></a>\n    <a href="https://instagram.com/adhemswag" aria-label="Instagram" target="_blank" rel="noopener"><span>IG</span></a>\n    <a href="https://x.com/adhemdwag" aria-label="X" target="_blank" rel="noopener"><span>𝕏</span></a>\n    <a href="https://tiktok.com/@adhemswagg" aria-label="TikTok" target="_blank" rel="noopener"><span>TT</span></a>\n    <a href="https://t.me/adhemswag" aria-label="Telegram" target="_blank" rel="noopener"><span>TG</span></a>\n    <a href="https://discord.gg/adhemswag" aria-label="Discord" target="_blank" rel="noopener"><span>DS</span></a>\n    <a href="https://youtube.com/adhemswag" aria-label="YouTube" target="_blank" rel="noopener"><span>YT</span></a>\n  </div>\n'''
          css = '''\n  .footer-socials{ display:flex; justify-content:center; align-items:center; gap:10px; margin:16px 0 4px; }\n  .footer-socials a{ width:34px; height:34px; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); color:var(--cyan); text-decoration:none; font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; transition:all .2s ease; }\n  .footer-socials a:hover{ background:rgba(17,217,247,.08); border-color:var(--cyan); box-shadow:0 0 12px rgba(17,217,247,.25); }\n'''
          if 'class="footer-socials"' not in s:
              s = s.replace('</footer>', block + '</footer>')
          if '.footer-socials{' not in s:
              s = s.replace('</style>', css + '\n</style>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes and remove workflow
        run: |
          rm -f .github/workflows/add-footer-socials.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bonuses/index.html .github/workflows/add-footer-socials.yml
          git commit -m 'Add social icons to bonuses footer' || exit 0
          git push
