name: Restore original bonus images
on:
  push:
    paths:
      - '.github/workflows/restore-original-bonus-images.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original images and keep partner names
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git revert --no-edit b933914053387e60f5409980c2097f33a3facbad
          python - <<'PY'
          from pathlib import Path
          p = Path('bonuses/index.html')
          s = p.read_text()
          s = s.replace('.card-logo{ padding:30px 24px 24px; display:flex; align-items:center; justify-content:center; min-height:90px; }', '.card-logo{ padding:30px 24px 24px; display:flex; align-items:center; justify-content:center; gap:12px; min-height:90px; }')
          s = s.replace('.card-logo img{ max-height:34px; max-width:100%; }', ".card-logo img{ max-height:34px; max-width:100%; }\n  .card-logo-name{ color:var(--cyan); font-family:'Rajdhani',sans-serif; font-size:22px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; text-shadow:0 0 12px rgba(17,217,247,.25); }")
          replacements = {
            'alt="ExitLag" style="height:34px; width:34px;">': 'alt="ExitLag" style="height:34px; width:34px;"><span class="card-logo-name">ExitLag</span>',
            'alt="NoPing" style="height:34px; width:34px;">': 'alt="NoPing" style="height:34px; width:34px;"><span class="card-logo-name">NoPing</span>',
            'alt="GGDrop" style="height:34px; width:34px;">': 'alt="GGDrop" style="height:34px; width:34px;"><span class="card-logo-name">GGDrop</span>',
            'alt="ESEA" style="height:34px; width:34px;">': 'alt="ESEA" style="height:34px; width:34px;"><span class="card-logo-name">ESEA</span>'
          }
          for a, b in replacements.items():
            s = s.replace(a, b, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/update-bonuses.yml .github/workflows/restore-original-bonus-images.yml
          git add bonuses/index.html .github/workflows/update-bonuses.yml .github/workflows/restore-original-bonus-images.yml
          git commit -m "Restore original bonus logos and keep partner names"
          git push