<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdhemSwag — Sign in with Twitch</title>
<meta name="description" content="Sign in to AdhemSwag with Twitch.">
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://adhemswag.com/login/">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#040608;--panel:#0a0f12;--line:rgba(17,217,247,.16);--cyan:#11D9F7;--white:#f4f7f8;--muted:#8c9aa0;--purple:#9146FF}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 18%,rgba(17,217,247,.07),transparent 34%),var(--bg);color:var(--white);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(460px,100%);border:1px solid var(--line);background:rgba(10,15,18,.96);padding:34px 30px;box-shadow:0 18px 70px rgba(0,0,0,.42)}
.brand{font-weight:800;letter-spacing:.16em;font-size:18px}.brand span{color:var(--cyan)}
.kicker{margin-top:8px;color:var(--muted);font:700 10px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase}
h1{margin:28px 0 10px;font-size:30px;line-height:1.08}
p{color:var(--muted);line-height:1.6;font-size:14px}
button{width:100%;margin-top:22px;border:1px solid rgba(145,70,255,.9);background:var(--purple);color:#fff;padding:14px 18px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
button:hover{filter:brightness(1.08)}button:disabled{opacity:.6;cursor:wait}
.status{min-height:20px;margin-top:14px;color:#ff7f8f;font:600 12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
.back{display:inline-block;margin-top:20px;color:var(--muted);font-size:12px;text-decoration:none}.back:hover{color:var(--cyan)}
</style>
</head>
<body>
<main class="card">
  <div class="brand">ADHEMSWAG <span>//</span> FNC REWARDS</div>
  <div class="kicker">TWITCH ACCOUNT ACCESS</div>
  <h1>Sign in with Twitch</h1>
  <p>Connect your Twitch account to access your AdhemSwag profile, watch rewards, XP and community features.</p>
  <button id="twitchLogin" type="button" data-adhem-login>◉ SIGN IN WITH TWITCH</button>
  <div id="loginStatus" class="status" aria-live="polite"></div>
  <a class="back" href="/">← Back to AdhemSwag</a>
</main>
<script src="/auth.js"></script>
<script>
(function(){
  const button=document.getElementById('twitchLogin');
  if(!button) return;
  button.addEventListener('click',()=>{button.disabled=true;}, {capture:true});
})();
</script>
</body>
</html>
