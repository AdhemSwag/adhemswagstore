<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — AdhemSwag FNC Rewards</title>
<meta name="description" content="Sign in to your AdhemSwag FNC Rewards profile with Twitch or Kick.">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070a;--panel:#0b0f12;--cyan:#11d9f7;--cyan-dim:#0a8fa3;
  --white:#eaf6f8;--muted:#6b7a80;--line:rgba(17,217,247,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--white);font-family:Inter,sans-serif}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background-image:linear-gradient(rgba(17,217,247,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(17,217,247,.045) 1px,transparent 1px);
  background-size:42px 42px;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 20%,rgba(17,217,247,.08),transparent 58%);
}
.login-shell{width:min(460px,100%);position:relative;z-index:1}
.brand{text-align:center;margin-bottom:28px}
.brand-mark{
  width:44px;height:44px;margin:0 auto 14px;border:1px solid var(--cyan);
  display:flex;align-items:center;justify-content:center;color:var(--cyan);
  font-family:'JetBrains Mono',monospace;font-weight:700;
  box-shadow:0 0 18px rgba(17,217,247,.15)
}
.brand-name{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.14em}
.brand-name span{color:var(--cyan)}
.login-card{
  background:linear-gradient(180deg,rgba(14,19,22,.98),rgba(7,9,12,.98));
  border:1px solid var(--line);padding:34px;position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,.35)
}
.login-card:before,.login-card:after{
  content:"";position:absolute;width:15px;height:15px;border-color:var(--cyan);
  border-style:solid;opacity:.9
}
.login-card:before{top:-1px;left:-1px;border-width:2px 0 0 2px}
.login-card:after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.eyebrow{font:11px 'JetBrains Mono',monospace;letter-spacing:.18em;color:var(--cyan-dim);text-transform:uppercase;margin-bottom:9px}
h1{font:700 38px/1 'Rajdhani',sans-serif;text-transform:uppercase;letter-spacing:.02em;margin-bottom:12px}
.intro{font-size:14px;line-height:1.6;color:var(--muted);margin-bottom:28px}
.platforms{display:grid;gap:12px}
.platform-btn{
  width:100%;border:1px solid var(--line);background:#0b0f12;color:var(--white);
  min-height:56px;padding:0 18px;display:flex;align-items:center;gap:14px;
  font:600 12px 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;
  cursor:pointer;transition:.2s
}
.platform-btn:hover{border-color:var(--cyan);background:rgba(17,217,247,.06);box-shadow:0 0 18px rgba(17,217,247,.12)}
.platform-icon{width:22px;text-align:center;color:var(--cyan);font-size:18px}
.platform-btn span:last-child{margin-left:auto;color:var(--cyan);font-size:18px}
.note{
  margin-top:22px;padding-top:18px;border-top:1px solid var(--line);
  color:#71858a;font:10px/1.6 'JetBrains Mono',monospace;letter-spacing:.04em;text-align:center
}
.back{display:block;text-align:center;margin-top:18px;color:var(--muted);text-decoration:none;font:11px 'JetBrains Mono',monospace}
.back:hover{color:var(--cyan)}
.status{min-height:18px;margin-top:14px;text-align:center;color:#ffb4b4;font:10px 'JetBrains Mono',monospace}
@media(max-width:480px){.login-card{padding:26px 20px}h1{font-size:34px}}
</style>
</head>
<body>
<main class="login-shell">
  <div class="brand">
    <div class="brand-mark">A</div>
    <div class="brand-name">ADHEMSWAG <span>//</span> FNC REWARDS</div>
  </div>

  <section class="login-card">
    <div class="eyebrow">ACCOUNT ACCESS</div>
    <h1>Sign in</h1>
    <p class="intro">Choose your platform<br>Sign in with Twitch or Kick. You can connect the other platform later.</p>

    <div class="platforms">
      <button class="platform-btn" type="button" data-provider="twitch">
        <span class="platform-icon">◉</span>
        <span>Continue with Twitch</span>
        <span>→</span>
      </button>
      <button class="platform-btn" type="button" data-provider="kick">
        <span class="platform-icon">◆</span>
        <span>Continue with Kick</span>
        <span>→</span>
      </button>
    </div>

    <div class="status" id="loginStatus" aria-live="polite"></div>

    <div class="note">
      ONE PROFILE · TWITCH + KICK<br>
      Your FNC balance stays on the same account. No double rewards.
    </div>
  </section>

  <a class="back" href="/">← BACK TO ADHEMSWAG.COM</a>
</main>

<script>
document.querySelectorAll('[data-provider]').forEach(function(button){
  button.addEventListener('click',function(){
    const provider=this.dataset.provider;
    const status=document.getElementById('loginStatus');
    status.textContent = provider === 'twitch'
      ? 'TWITCH LOGIN WILL BE CONNECTED HERE.'
      : 'KICK LOGIN WILL BE CONNECTED HERE.';
  });
});
</script>
</body>
</html>
